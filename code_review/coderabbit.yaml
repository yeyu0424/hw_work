Analyze
→ Gather Evidence
→ Verify
→ Pass / Fail
的 Agent Harness 模式。
7. Path / AST Instructions
Path-based review instructions
AST-based path instructions
适合研究 Review Policy Engine。

三十、最后给你一个“CodeRabbit 实现思想”的一句话版本
如果把所有公开资料压缩成一句：
CodeRabbit = Deterministic Code Intelligence + Context Engineering + Agentic Investigation + Multi-Agent Verification + Isolated Execution + Persistent Review Memory + Continuous Evaluation。
而不是：
CodeRabbit = GPT/Claude + git diff。
对于你现在正在研究的 Harness-based Code Review，我认为最值得进一步拆的是这 4 个部分：
① Context Engine 怎么构建
② Reviewer / Verifier Agent 如何协同
③ Sandbox + Tool Runtime 怎么设计
④ Evaluation Harness 怎么定义 recall / precision
这四块基本决定了一个“AI Code Review”产品能不能从 Demo 走向生产。
下一步最有价值的是直接把 CodeRabbit 的整个 Review Pipeline 反向拆成一张“可实现架构图”：包括 Orchestrator / Context Engine / Code Graph / Tool Registry / Review Agent / Verification Agent / Memory / Eval Harness 的类、接口、事件流，以及给出一套 Python/TypeScript 可落地的 Harness 目录结构。